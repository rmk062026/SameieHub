name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SameieHub.slnx

      - name: Build
        run: dotnet build SameieHub.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test SameieHub.slnx --no-build --configuration Release --verbosity normal
